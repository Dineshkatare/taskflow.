name: taskflow
description: TaskFlow — a team task manager for Android, iOS and Web, built with Flutter.
publish_to: none

version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Material widgets moved out of the Flutter SDK into this package (Flutter 3.47+).
  material_ui: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
